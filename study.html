var SHU = ['Jing-Well','Ying-Spring','Shu-Stream','Jing-River','He-Sea'], ELS = ['Wood','Fire','Earth','Metal','Water'];
var mode = 'mix', scope = '', cur = null, answered = false;
var st = {n:0, ok:0, streak:0, best:0};
try { st.best = +localStorage.getItem('shu-best') || 0; } catch(e) {}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function seg(id, opts, get, set){
  var box = document.getElementById(id);
  box.innerHTML = opts.map(function(o){ return '<button type="button" data-v="'+o[0]+'">'+o[1]+'</button>'; }).join('');
  function sync(){ box.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-v')===get() ? 'true' : 'false'); }); }
  box.addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return; set(b.getAttribute('data-v')); sync(); next(); });
  sync();
}
seg('mode', [['mix','Mixed'],['cat','Category'],['elem','Element'],['find','Find the point']], function(){ return mode; }, function(v){ mode = v; });
seg('scope', [['','All channels']].concat(ELS.map(function(e){ return [e, '<span class="dot" style="--c:var(--'+e.toLowerCase()+')"></span>'+e]; })), function(){ return scope; }, function(v){ scope = v; });
function chip(p){ return '<span class="c" style="--tint:var(--t-'+p.chElem.toLowerCase()+')">'+p.code+'</span>'; }
function make(){
  var pool = P.filter(function(p){ return !scope || p.chElem === scope; });
  var m = mode === 'mix' ? pick(['cat','elem','find']) : mode, p = pick(pool), q;
  if(m === 'cat'){
    q = {kind:'Shu category', text:'Which Shu category is '+chip(p)+' '+esc(p.py)+'?', answer:p.shu,
         opts:shuffle([p.shu].concat(shuffle(SHU.filter(function(s){ return s!==p.shu; })).slice(0,3)))};
  } else if(m === 'elem'){
    q = {kind:'Element', text:'Which element is '+chip(p)+' '+esc(p.py)+' on the '+esc(p.chName)+' channel?', answer:p.elem,
         opts:shuffle([p.elem].concat(shuffle(ELS.filter(function(e){ return e!==p.elem; })).slice(0,3))), el:true};
  } else {
    var sibs = P.filter(function(x){ return x.ch===p.ch && x.code!==p.code; });
    q = {kind:'Find the point', text:'Which point is the '+p.shu+' point of the '+esc(p.chName)+' channel?', answer:p.code,
         opts:shuffle([p.code].concat(shuffle(sibs).slice(0,3).map(function(x){ return x.code; })))};
  }
  q.p = p; return q;
}
function label(q, v){
  if(q.el) return '<span class="dot" style="--c:var(--'+v.toLowerCase()+')"></span>'+v;
  if(q.kind === 'Find the point'){ var x = P.filter(function(y){ return y.code===v; })[0]; return v+' <span style="color:var(--ink-3);font-weight:400">'+esc(x.py)+'</span>'; }
  return v;
}
function stats(){
  document.getElementById('s-score').textContent = st.ok+' / '+st.n;
  document.getElementById('s-streak').textContent = st.streak;
  document.getElementById('s-best').textContent = st.best;
}
function next(){
  var prev = cur && cur.p.code;
  do { cur = make(); } while(cur.p.code === prev && P.length > 1);
  answered = false;
  var c = document.getElementById('card');
  c.innerHTML = '<div class="qk">'+cur.kind+'</div><div class="qt">'+cur.text+'</div><div class="opts">'
    + cur.opts.map(function(v,i){ return '<button type="button" class="opt" data-v="'+v+'"><kbd>'+(i+1)+'</kbd>'+label(cur,v)+'</button>'; }).join('')
    + '</div><div id="fb"></div>';
  c.classList.remove('in'); void c.offsetWidth; c.classList.add('in');
  c.querySelectorAll('.opt').forEach(function(b){ b.addEventListener('click', function(){ answer(b.getAttribute('data-v')); }); });
}
function answer(v){
  if(answered) return; answered = true;
  var good = v === cur.answer, p = cur.p;
  st.n++; if(good){ st.ok++; st.streak++; if(st.streak > st.best){ st.best = st.streak; try { localStorage.setItem('shu-best', st.best); } catch(e) {} } } else st.streak = 0;
  stats();
  document.querySelectorAll('.opt').forEach(function(b){
    var x = b.getAttribute('data-v'); b.disabled = true;
    if(x === cur.answer) b.classList.add('right'); else if(x === v) b.classList.add('wrong');
  });
  document.getElementById('fb').innerHTML = '<div class="fb"><p><span class="'+(good?'ok':'no')+'">'+(good?'Correct.':'Not quite.')+'</span> '
    + '<b>'+p.code+' '+esc(p.py)+'</b> is the '+p.shu+' point of the '+esc(p.chName)+' channel ('+p.yy+'), element '+p.elem+'.</p>'
    + '<div class="acts"><a class="btn" href="'+p.file+'#'+p.code+'">See on chart</a><button type="button" class="btn pri" id="nx">Next ⏎</button></div></div>';
  document.getElementById('nx').addEventListener('click', next);
  document.getElementById('nx').focus({preventScroll:true});
}
document.addEventListener('keydown', function(e){
  if(e.target.closest && e.target.closest('input,textarea')) return;
  if(!answered && /^[1-4]$/.test(e.key)){ var o = document.querySelectorAll('.opt')[+e.key-1]; if(o){ e.preventDefault(); o.click(); } }
  else if(answered && e.key === 'Enter' && document.activeElement && document.activeElement.id !== 'nx'){ e.preventDefault(); next(); }
});
stats(); next();
