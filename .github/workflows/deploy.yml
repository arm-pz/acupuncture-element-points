name: Deploy to acu.caffeinity.com

# Every merge to main publishes the site to Cloudflare Pages (custom domain acu.caffeinity.com).
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check generated blocks are in sync
        run: |
          python3 tools/sync-points.py --check
          python3 tools/sync-footer.py
          python3 tools/sync-favicon.py
          git diff --exit-code -- '*.html' || { echo '::error::Run tools/sync-footer.py and tools/sync-favicon.py and commit the result'; exit 1; }

      - name: Build site
        run: python3 tools/build-site.py

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=shu-atlas --branch=main --commit-dirty=true
