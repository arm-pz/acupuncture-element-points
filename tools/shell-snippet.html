<script data-shell data-page="index">
/* ---------- procedural scenes: one painted world per element ---------- */
const SW = 1600, SH = 900;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function noiser(r){const p=new Float32Array(512);for(let i=0;i<512;i++)p[i]=r();return x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return p[i&511]*(1-u)+p[(i+1)&511]*u}}
function fbm(n,x,o){let a=.5,s=0,f=1,m=0;for(let i=0;i<(o||4);i++){s+=a*n(x*f+i*31.7);m+=a;a*=.5;f*=2.03}return s/m}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(.35,rgba(col,a*.45));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function spark(c,x,y,rad,col,a){const g=c.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.beginPath();c.arc(x,y,rad,0,7);c.fill()}
function sky(c,y0,y1,stops){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach(s=>g.addColorStop(s[0],s[1]));c.fillStyle=g;c.fillRect(0,y0,SW,y1-y0)}
function mist(c,y,h,col,a){const g=c.createLinearGradient(0,y-h,0,y+h);g.addColorStop(0,rgba(col,0));g.addColorStop(.5,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(0,y-h,SW,h*2)}
function additive(c,fn){c.globalCompositeOperation='lighter';fn();c.globalCompositeOperation='source-over'}
function ridge(c,o){
  const n=noiser(rng(o.seed)),pts=[];
  for(let x=0;x<=SW;x+=4){
    let v=fbm(n,x/SW*o.freq+o.seed,5);
    if(o.jag)v=Math.pow(1-Math.abs(2*v-1),3);else v=(v-.25)*2;
    pts.push([x,o.base-v*o.amp]);
  }
  c.beginPath();c.moveTo(0,SH);pts.forEach(p=>c.lineTo(p[0],p[1]));c.lineTo(SW,SH);c.closePath();
  const g=c.createLinearGradient(0,o.base-o.amp,0,SH);g.addColorStop(0,o.top);g.addColorStop(1,o.bot);
  c.fillStyle=g;c.fill();return pts;
}
function crest(c,pts,col,w,blur,dy){
  c.save();c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]+(dy||0)):c.moveTo(p[0],p[1]+(dy||0)));
  c.strokeStyle=col;c.lineWidth=w;c.lineJoin='round';if(blur){c.shadowColor=col;c.shadowBlur=blur}c.stroke();c.restore();
}
function stars(c,r,n,maxY,a){c.fillStyle='#fff';for(let i=0;i<n;i++){c.globalAlpha=(.15+r()*.7)*a;const s=.5+r()*1.4;c.fillRect(r()*SW,r()*maxY,s,s)}c.globalAlpha=1}
function grain(c,r){
  const t=document.createElement('canvas');t.width=t.height=160;const x=t.getContext('2d'),d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=22}
  x.putImageData(d,0,0);c.globalCompositeOperation='overlay';c.fillStyle=c.createPattern(t,'repeat');c.fillRect(0,0,SW,SH);c.globalCompositeOperation='source-over';
}

/* WOOD: spring dawn through bamboo */
function paintWood(c,r){
  sky(c,0,SH,[[0,'#06130f'],[.32,'#123a2e'],[.58,'#5d8f58'],[.74,'#d9e69a'],[1,'#e8efb4']]);
  additive(c,()=>{glow(c,SW*.5,SH*.62,SW*.42,[255,244,170],.75);glow(c,SW*.5,SH*.62,SW*.1,[255,252,214],.9)});
  const cols=[['#7fa56a','#4f7a4f'],['#4f7d56','#2f5a3f'],['#2d5a43','#173a2b'],['#173a2b','#0a1f17']];
  [.66,.72,.79,.88].forEach((b,i)=>{
    ridge(c,{base:SH*b,amp:90+i*40,freq:2.2+i*.6,seed:11+i*7,top:cols[i][0],bot:cols[i][1]});
    mist(c,SH*(b+.02),60,[220,238,170],Math.max(.06,.28-i*.07));
  });
  const stalk=(x,w,c1,c2,al)=>{
    const g=c.createLinearGradient(x-w/2,0,x+w/2,0);g.addColorStop(0,c2);g.addColorStop(.35,c1);g.addColorStop(1,c2);
    c.globalAlpha=al;c.fillStyle=g;c.fillRect(x-w/2,-10,w,SH+10);
    c.fillStyle='rgba(0,0,0,.3)';
    for(let y=SH-50;y>0;y-=70+r()*70)c.fillRect(x-w/2-1,y,w+2,Math.max(2,w*.12));
    c.globalAlpha=1;
  };
  for(let i=0;i<22;i++)stalk(r()*SW,5+r()*5,'#2f6a49','#17402e',.42);
  const side=(a,b)=>r()<.5?SW*(.02+r()*a):SW*(1-.02-r()*b);
  for(let i=0;i<12;i++)stalk(side(.34,.34),10+r()*7,'#1f5a3b','#0f2f21',.82);
  for(let i=0;i<6;i++)stalk(side(.2,.2),26+r()*18,'#14392a','#06140f',1);
  for(let i=0;i<110;i++){
    const x=r()<.5?SW*r()*.4:SW*(.6+r()*.4),y=SH*(.1+r()*.7);
    c.save();c.translate(x,y);c.rotate((r()-.5)*2.6);
    c.fillStyle=`rgba(${90+r()*80|0},${170+r()*70|0},${90+r()*40|0},${.35+r()*.5})`;
    c.beginPath();c.ellipse(0,0,16+r()*26,3+r()*4,0,0,7);c.fill();c.restore();
  }
  additive(c,()=>{for(let i=0;i<80;i++){const s=2+r()*8;spark(c,r()*SW,SH*(.25+r()*.65),s*2.2,[205,240,130],.25+r()*.4);spark(c,r()*SW,SH*(.3+r()*.6),s*.5,[255,255,220],.5)}});
}

/* FIRE: a furnace glowing between black peaks, sparks rising */
function paintFire(c,r){
  sky(c,0,SH,[[0,'#080302'],[.3,'#2a0906'],[.55,'#8a2410'],[.72,'#e0561a'],[1,'#ff9a3c']]);
  additive(c,()=>{glow(c,SW*.5,SH*.66,SW*.52,[255,120,40],.8);glow(c,SW*.5,SH*.64,SW*.16,[255,200,110],.95);glow(c,SW*.5,SH*.63,SW*.055,[255,240,200],1)});
  const p1=ridge(c,{base:SH*.72,amp:230,freq:2.4,seed:5,jag:1,top:'#2a0c07',bot:'#0d0403'});
  crest(c,p1,'rgba(255,150,60,.8)',2,22);
  for(let i=0;i<14;i++){c.fillStyle='rgba(20,6,4,.20)';const x=SW*(.25+r()*.5),y=SH*(.25+r()*.3),g=c.createRadialGradient(x,y,0,x,y,150+r()*160);g.addColorStop(0,'rgba(30,8,5,.32)');g.addColorStop(1,'rgba(30,8,5,0)');c.fillStyle=g;c.fillRect(x-320,y-320,640,640)}
  const p2=ridge(c,{base:SH*.82,amp:150,freq:2.8,seed:9,jag:1,top:'#160605',bot:'#050202'});
  crest(c,p2,'rgba(255,110,40,.35)',1.5,12);
  ridge(c,{base:SH*.94,amp:90,freq:3.4,seed:21,jag:1,top:'#0b0403',bot:'#020101'});
  additive(c,()=>{
    for(let i=0;i<340;i++){
      const lift=Math.pow(r(),1.4),spread=Math.pow(r(),1.6);
      const x=SW*.5+(r()-.5)*SW*(.22+spread*.95),y=SH*.7-lift*SH*.78;
      const s=Math.max(.5,(.7+r()*2.6)*(1-lift*.7));
      spark(c,x,y,s*3.4,r()<.55?[255,170,70]:[255,96,36],.3+r()*.5);spark(c,x,y,s,[255,240,200],.9);
    }
  });
}

/* EARTH: terraced ochre hills under a hazy low sun */
function paintEarth(c,r){
  sky(c,0,SH,[[0,'#2a1c0e'],[.35,'#6e4521'],[.62,'#d79a4c'],[.8,'#f0c57a'],[1,'#f4d594']]);
  additive(c,()=>{glow(c,SW*.5,SH*.52,SW*.4,[255,222,150],.7);glow(c,SW*.5,SH*.52,SW*.09,[255,246,214],.9)});
  c.fillStyle='rgba(255,244,214,.93)';c.beginPath();c.arc(SW*.5,SH*.5,56,0,7);c.fill();
  const L=[{b:.62,a:70,f:1.6,t:'#c98d4a',d:'#a8692f'},{b:.7,a:92,f:2,t:'#b07a3b',d:'#8a5226'},{b:.79,a:112,f:2.4,t:'#8f5a2a',d:'#64391b'},{b:.9,a:126,f:2.8,t:'#5c3519',d:'#34200f'}];
  L.forEach((o,i)=>{
    const pts=ridge(c,{base:SH*o.b,amp:o.a,freq:o.f,seed:31+i*13,top:o.t,bot:o.d});
    for(let k=1;k<=7;k++){c.beginPath();pts.forEach((p,j)=>j?c.lineTo(p[0],p[1]+k*(11+i*5)):c.moveTo(p[0],p[1]+k*(11+i*5)));c.strokeStyle='rgba(30,15,5,'+(.2-k*.014)+')';c.lineWidth=1.6;c.stroke()}
    crest(c,pts,'rgba(255,226,160,.28)',1.2,0);
    mist(c,SH*(o.b+.03),50,[245,205,140],Math.max(.05,.24-i*.06));
  });
  additive(c,()=>{for(let i=0;i<170;i++){const y=SH*(.2+r()*.7);spark(c,r()*SW,y,1.5+r()*5,[255,214,140],.18+r()*.4)}});
}

/* METAL: a silver moon ringing over cold, hard peaks */
function paintMetal(c,r){
  sky(c,0,SH,[[0,'#070b11'],[.4,'#1a2634'],[.7,'#53697c'],[.9,'#a9bac8'],[1,'#c9d6e0']]);
  stars(c,r,150,SH*.5,1);
  const mx=SW*.5,my=SH*.44;
  additive(c,()=>{glow(c,mx,my,SW*.34,[190,215,240],.55)});
  for(let k=1;k<=6;k++){c.beginPath();c.arc(mx,my,SW*(.07+k*.045),0,7);c.strokeStyle=rgba([220,235,250],Math.max(.03,.2-k*.028));c.lineWidth=1.2;c.stroke()}
  const mg=c.createRadialGradient(mx-18,my-18,6,mx,my,SW*.075);mg.addColorStop(0,'#fbfdff');mg.addColorStop(1,'#c3d1de');
  c.fillStyle=mg;c.beginPath();c.arc(mx,my,SW*.075,0,7);c.fill();
  for(let i=0;i<9;i++){const a=r()*6.28,d=r()*SW*.05;c.fillStyle='rgba(120,140,160,'+(.06+r()*.1)+')';c.beginPath();c.arc(mx+Math.cos(a)*d,my+Math.sin(a)*d,5+r()*14,0,7);c.fill()}
  for(let i=0;i<8;i++){c.fillStyle='rgba(220,235,250,'+(.04+r()*.06)+')';c.fillRect(r()*SW*.6,SH*(.3+r()*.35),SW*(.2+r()*.4),1.5)}
  const p1=ridge(c,{base:SH*.7,amp:260,freq:2.6,seed:41,jag:1,top:'#42586b',bot:'#16222d'});crest(c,p1,'rgba(235,245,255,.6)',1.6,0);
  const p2=ridge(c,{base:SH*.8,amp:190,freq:3,seed:47,jag:1,top:'#27394a',bot:'#0d151d'});crest(c,p2,'rgba(210,228,245,.32)',1.2,0);
  mist(c,SH*.82,70,[190,210,230],.16);
  ridge(c,{base:SH*.93,amp:100,freq:3.6,seed:53,jag:1,top:'#131d27',bot:'#05080c'});
}

/* WATER: a winter sea, one moon, one ripple */
function paintWater(c,r){
  const hy=SH*.56;
  sky(c,0,hy,[[0,'#02050b'],[.55,'#0a1b32'],[1,'#1d4a78']]);
  stars(c,r,230,hy*.9,1);
  additive(c,()=>{glow(c,SW*.5,SH*.34,SW*.22,[170,200,255],.5);glow(c,SW*.5,SH*.34,SW*.05,[230,240,255],.9)});
  c.fillStyle='#eaf2ff';c.beginPath();c.arc(SW*.5,SH*.34,SW*.03,0,7);c.fill();
  sky(c,hy,SH,[[0,'#17406b'],[.45,'#07182c'],[1,'#02070e']]);
  mist(c,hy,36,[120,170,230],.28);
  for(let y=hy+2;y<SH;y+=5){
    const p=(y-hy)/(SH-hy),len=(14+p*230)*(.4+r()*.9),x=SW*.5+(r()-.5)*(10+p*70);
    c.fillStyle=rgba([190,215,255],(1-p*.7)*.5);c.fillRect(x-len/2,y,len,1.5+p*2.5);
  }
  for(let y=hy+8;y<SH;y+=Math.max(6,(y-hy)*.09)){
    const p=(y-hy)/(SH-hy),a=(y-hy)*.012+.6,ph=r()*6;
    c.beginPath();for(let x=0;x<=SW;x+=16){const yy=y+Math.sin(x*.012*(1-p*.5)+ph)*a;x?c.lineTo(x,yy):c.moveTo(x,yy)}
    c.strokeStyle='rgba(120,170,230,'+(.05+p*.08)+')';c.lineWidth=1;c.stroke();
  }
  for(let k=1;k<=7;k++){const rx=62*k;c.beginPath();c.ellipse(SW*.5,SH*.78,rx,rx*.17,0,0,7);c.strokeStyle=rgba([190,220,255],Math.max(.05,.34-k*.04));c.lineWidth=1.3;c.stroke()}
  additive(c,()=>{glow(c,SW*.5,SH*.78,SW*.06,[170,205,255],.3)});
}

const PAINT={wood:paintWood,fire:paintFire,earth:paintEarth,metal:paintMetal,water:paintWater};
function renderScene(key,seed){
  const cv=document.createElement('canvas');cv.width=SW;cv.height=SH;
  const c=cv.getContext('2d');PAINT[key](c,rng(seed));grain(c,rng(seed+99));
  return cv.toDataURL('image/jpeg',.86);
}

/* ---------- app shell: Elements, Channels and Points as views of one document ---------- */
window.ShuAtlas=window.ShuAtlas||(function(){
'use strict';
var KEYS=['wood','fire','earth','metal','water'],APP={index:1,channels:1,points:1};
var nav=document.getElementById('shu-nav'),layers=document.querySelectorAll('#shu-scene i');
var current=document.currentScript.getAttribute('data-page'),views={},pending={},urls={},element='',top=0;
var live=/^https?:$/.test(location.protocol)&&!!(window.fetch&&window.DOMParser&&history.pushState);
var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* scenes are painted once per element and shared by the ring and the backdrop */
function scene(key){return urls[key]||(urls[key]=renderScene(key,101+KEYS.indexOf(key)*37))}
function showScene(){
  if(!element||current==='index')return;
  var next=layers[top^1],url='url('+scene(element)+')';
  if(layers[top].style.backgroundImage===url){layers[top].classList.add('on');return}
  next.style.backgroundImage=url;next.classList.add('on');layers[top].classList.remove('on');top^=1;
}
function setElement(key){
  if(KEYS.indexOf(key)<0||key===element)return;
  element=key;try{sessionStorage.setItem('shu-el',key)}catch(e){}
  showScene();
}

function keyOf(href){
  var u;try{u=new URL(href,location.href)}catch(e){return null}
  var dir=function(p){return p.slice(0,p.lastIndexOf('/')+1)};
  if(u.origin!==location.origin||dir(u.pathname)!==dir(location.pathname))return null;
  var f=u.pathname.slice(u.pathname.lastIndexOf('/')+1).replace(/\.html$/,'')||'index';
  return APP[f]?f:null;
}
function isShell(n){return n.nodeType===1&&n.hasAttribute('data-shell')}
function stylesIn(root){return [].slice.call(root.querySelectorAll('style:not([data-shell])'))}
function themeOf(doc){var m=doc.querySelector('meta[name="theme-color"]');return m?m.getAttribute('content'):''}

/* the page the visitor landed on becomes the first view */
function adopt(){
  views[current]={key:current,title:document.title,theme:themeOf(document),sheets:stylesIn(document),started:true,scroll:0,scripts:[],
    nodes:[].filter.call(document.body.childNodes,function(n){return !isShell(n)&&n.nodeName!=='SCRIPT'&&n.nodeName!=='STYLE'&&n.nodeName!=='LINK'})};
}
/* every other view is fetched once, then kept alive: its filters, search and scroll survive a round trip */
function load(key){
  if(views[key])return Promise.resolve(views[key]);
  return pending[key]||(pending[key]=fetch(key+'.html',{credentials:'same-origin'}).then(function(r){
    if(!r.ok)throw new Error(r.status);return r.text();
